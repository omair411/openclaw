# /etc/squid/squid.conf
# Non-MITM forward proxy (CONNECT allowlist)
#
# This configuration DOES NOT decrypt HTTPS. It only controls which destinations
# may be reached via CONNECT (HTTPS) and optionally which domains may be reached
# over plain HTTP.

# Listen for proxy traffic
http_port 3128

# -----------------------------
# Destination allowlists
# -----------------------------
# HTTPS destinations (CONNECT)
acl allowed_https dstdomain \
  .openai.com \
  .api.openai.com \
  .anthropic.com \
  .dashscope-intl.aliyuncs.com \
  .dashscope.aliyuncs.com \
  .npmjs.org

# Optional: plain HTTP destinations
acl allowed_http dstdomain \
  .openai.com \
  .api.openai.com \
  .anthropic.com \
  .dashscope-intl.aliyuncs.com \
  .dashscope.aliyuncs.com \
  .npmjs.org

# -----------------------------
# Access control
# -----------------------------
acl CONNECT method CONNECT

# Allow CONNECT only to allowlisted HTTPS domains
http_access allow CONNECT allowed_https
http_access deny CONNECT

# Allow basic HTTP requests only to allowlisted domains
http_access allow allowed_http

# Deny everything else
http_access deny all

# Logging
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log

# No disk cache needed
cache deny all
